
<!DOCTYPE html>
<html lang="en">
<body>
    <h2>Leave Request Update</h2>
    <p>Hello {{ employee_name }},</p>
    <p>Your leave request has been {{ status | lower }}.</p>
    <p><strong>Leave Type:</strong> {{ leave_type_name }}</p>
    <p><strong>From:</strong> {{ start_date }}</p>
    <p><strong>To:</strong> {{ end_date }}</p>
    {% if decision_note %}
    <p><strong>HR Remarks:</strong> {{ decision_note }}</p>
    {% endif %}
</body>
</html>
